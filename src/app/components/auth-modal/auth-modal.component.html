<div class="modal-backdrop" *ngIf="bookingStorage.isAuthModalOpen()" (click)="close()">
  <div class="modal-dialog-box glass-card" (click)="$event.stopPropagation()">
    
    <button class="modal-close-btn" (click)="close()" aria-label="Fechar Modal">✕</button>

    <!-- Cabeçalho & Abas -->
    <div class="auth-tabs-header">
      <button 
        type="button"
        class="tab-btn" 
        [class.active]="!isRegisterTab" 
        (click)="switchTab(false)"
      >
        Entrar na Conta
      </button>
      <button 
        type="button"
        class="tab-btn" 
        [class.active]="isRegisterTab" 
        (click)="switchTab(true)"
      >
        Criar Nova Conta
      </button>
    </div>

    <!-- Formulário -->
    <form class="auth-form-body" (ngSubmit)="submitAuth()">

      <!-- Nome -->
      <div class="modal-field">
        <label>{{ isRegisterTab ? 'Nome Completo *' : 'Nome *' }}</label>
        <input
          type="text"
          name="name"
          class="modal-input"
          placeholder="Ex: Carlos Eduardo"
          [(ngModel)]="name"
          autocomplete="name"
        />
      </div>

      <!-- Apelido (se cadastro) -->
      <div class="modal-field" *ngIf="isRegisterTab">
        <label>Como gosta de ser chamado</label>
        <input
          type="text"
          name="nickname"
          class="modal-input"
          placeholder="Ex: Dudu"
          maxlength="100"
          [(ngModel)]="nickname"
        />
      </div>

      <!-- Telefone / WhatsApp -->
      <div class="modal-field">
        <label>WhatsApp / Celular *</label>
        <input
          type="tel"
          name="phone"
          class="modal-input"
          placeholder="(31) 98020-8758"
          [(ngModel)]="phone"
          autocomplete="tel"
        />
      </div>

      <p class="auth-hint" *ngIf="!isRegisterTab">
        Entre com o mesmo nome e telefone usados no cadastro.
      </p>

      <div class="auth-error" *ngIf="errorMessage" role="alert">{{ errorMessage }}</div>

      <button type="submit" class="btn-gold w-100 btn-submit-auth" [disabled]="loading">
        {{ loading ? 'Aguarde...' : (isRegisterTab ? 'Finalizar Cadastro & Conectar' : 'Acessar Barbearia') }}
      </button>

      <div class="auth-perks-box">
        <span>⭐ Agende em 1 clique</span>
        <span>💈 Histórico de cortes</span>
        <span>🎁 Pontos de fidelidade</span>
      </div>

    </form>

  </div>
</div>
