<div class="toast-fixed-wrapper" *ngIf="bookingStorage.toastMessage() as toast">
  <div class="toast-card glass-card" [class]="'toast-' + toast.type">
    <div class="toast-icon">
      <span *ngIf="toast.type === 'success'">✂️</span>
      <span *ngIf="toast.type === 'info'">ℹ️</span>
      <span *ngIf="toast.type === 'error'">⚠️</span>
    </div>
    
    <div class="toast-body">
      <h4 class="toast-title">{{ toast.title }}</h4>
      <p class="toast-text">{{ toast.text }}</p>
    </div>

    <button class="toast-close" (click)="close()">✕</button>
  </div>
</div>
